[project]
name = "mona"
version = "0.1.0"
description = "Mona API, MCP server and background jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
    "psycopg[binary,pool]==3.3.6",
    "alembic==1.20.0",
    "procrastinate==3.10.0",
    "pydantic-ai-slim[openai]==2.52.0",
    "fastmcp==4.0.10",
    "httpx==0.28.1",
    "typer==0.27.2",
    "pyyaml==6.0.3",
    "argon2-cffi==25.1.0",
]

[project.scripts]
mona = "mona.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mona"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
