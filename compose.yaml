x-python-env: &python-env
  HOME: /tmp
  DATABASE_URL: postgresql+psycopg://mona:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mona
  MONA_ENV: dev
  MONA_DATA_DIR: /data
  PROCRASTINATE_APP: mona.jobs.app
  PROCRASTINATE_LOG_LEVEL: info
  MONA_LLM_MODEL: ${MONA_LLM_MODEL:-qwen/qwen3.7-flash}
  HERMES_URL: http://hermes:8642
  MONA_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-5173}
  PYTHONDONTWRITEBYTECODE: "1"

x-python: &python
  build: ./apps/api
  image: ${COMPOSE_PROJECT_NAME}-python:dev
  user: "${MONA_UID:-1000}:${MONA_GID:-1000}"
  env_file: .env
  environment: *python-env
  volumes:
    - ./apps/api:/app
    - ./data:/data
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    command: postgres -c log_error_verbosity=terse
    environment:
      POSTGRES_USER: mona
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mona
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mona -d mona"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *python
    command: mona migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *python
    command: uvicorn mona.app:app --host 0.0.0.0 --port 8765 --no-access-log --reload --reload-dir /app/src
    volumes:
      - ./apps/api:/app
      - ./data:/data
      - type: volume
        source: hermes_data
        target: /opt/data/cache/documents
        read_only: true
        volume:
          subpath: cache/documents
      - type: volume
        source: hermes_data
        target: /opt/data/cache/images
        read_only: true
        volume:
          subpath: cache/images
    depends_on:
      migrate:
        condition: service_completed_successfully
      hermes-seed:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${API_PORT:-8765}:8765
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-llm:
    <<: *python
    command: mona worker --queues llm --concurrency 1

  worker-cpu:
    <<: *python
    command: mona worker --queues cpu --concurrency 3

  # One-shot ops container of the host wrapper (deploy/bin/mona, C9 §6.3); never started by `up`.
  ops:
    <<: *python
    profiles: [ops]
    user: "0:0"
    environment:
      <<: *python-env
      MONA_HERMES_HOME: /hermes
      MONA_HERMES_SEED: /hermes-seed
      MONA_UID: ${MONA_UID:-1000}
      MONA_GID: ${MONA_GID:-1000}
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
    volumes:
      - ./apps/api:/app
      - ./data:/data
      - ./demo/seed:/seed:ro
      - ./deploy/hermes:/hermes-seed:ro
      - hermes_data:/hermes

  # Root one-shot: fresh named volumes are root-owned, and the web service runs as the host user.
  web-volumes:
    image: node:24
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for d in /volumes/root /volumes/app;
        do [ "$$(stat -c %u:%g $$d)" = "${MONA_UID:-1000}:${MONA_GID:-1000}" ]
        || chown -R ${MONA_UID:-1000}:${MONA_GID:-1000} $$d;
        done
    restart: "no"
    volumes:
      - web_node_modules:/volumes/root
      - web_app_node_modules:/volumes/app

  web:
    image: node:24
    user: "${MONA_UID:-1000}:${MONA_GID:-1000}"
    working_dir: /repo
    command: sh -c "npm install --no-audit --no-fund && npm run dev -w apps/web -- --host 0.0.0.0 --port 5173"
    environment:
      HOME: /tmp
      MONA_API_URL: http://api:8765
    ports:
      - 127.0.0.1:${WEB_PORT:-5173}:5173
    volumes:
      - ./:/repo
      - web_node_modules:/repo/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
    depends_on:
      web-volumes:
        condition: service_completed_successfully
      api:
        condition: service_started

  hermes-seed:
    image: &hermes-image nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e;
        for d in memories cache cache/documents cache/images; do
        [ -d /opt/data/$$d ] || install -d -m 755 -o ${HERMES_UID:-1000} -g ${HERMES_GID:-1000} /opt/data/$$d;
        done;
        for f in config.yaml SOUL.md; do
        [ -e /opt/data/$$f ] || install -m 644 -o ${HERMES_UID:-1000} -g ${HERMES_GID:-1000} /seed/$$f /opt/data/$$f;
        done
    restart: "no"
    volumes:
      - ./deploy/hermes:/seed:ro
      - hermes_data:/opt/data

  hermes:
    image: *hermes-image
    command: gateway run
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_MODEL_NAME: mona
      MONA_SERVICE_KEY: ${MONA_SERVICE_KEY:?set MONA_SERVICE_KEY in .env}
      MONA_CHAT_MODEL: ${MONA_CHAT_MODEL:-qwen/qwen3.7-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
    ports:
      - 127.0.0.1:${HERMES_PORT:-8642}:8642
    volumes:
      - hermes_data:/opt/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8642/health"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      hermes-seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  pgdata:
  hermes_data:
  web_node_modules:
  web_app_node_modules:
