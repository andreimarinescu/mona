name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/ui/node_modules
          key: node-modules-ubuntu-24.04-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/ui/node_modules
          key: node-modules-ubuntu-24.04-node24-${{ hashFiles('package-lock.json') }}
      - run: make web-check

  py:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mona
          POSTGRES_PASSWORD: mona
          POSTGRES_DB: mona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mona -d mona_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://mona:mona@localhost:5432/mona_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.12.10
          enable-cache: true
      - id: keys
        run: |
          echo "apt=apt-py-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          image=$(sed -n 's/.*&hermes-image \(.*\)$/\1/p' compose.yaml)
          [ -n "$image" ] || { echo "no &hermes-image in compose.yaml" >&2; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - id: apt
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.keys.outputs.apt }}
      - run: .github/apt-cache.sh
      - name: PostgreSQL 17 client (pg_dump for the schema parity test), poppler-utils and the image's OCR tools (the extraction tests)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          sudo apt-get install -y --no-install-recommends poppler-utils img2pdf ocrmypdf \
            tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng tesseract-ocr-ron
          .github/apt-cache.sh done
          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
      - if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.keys.outputs.apt }}
      - name: The pinned Hermes image (the Hermes image tests; a pull beats a 2.7 GB cache restore and load)
        env:
          IMAGE: ${{ steps.keys.outputs.image }}
        run: docker pull -q "$IMAGE"
      - name: An empty .env (docker compose config for the prod compose tests)
        run: touch .env
      - run: make py-check

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/ui/node_modules
          key: node-modules-ubuntu-24.04-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/ui/node_modules
          key: node-modules-ubuntu-24.04-node24-${{ hashFiles('package-lock.json') }}
      - id: keys
        run: |
          echo "playwright=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.keys.outputs.playwright }}-chromium
      - id: apt
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: apt-e2e-ubuntu-24.04-${{ steps.keys.outputs.playwright }}-${{ steps.keys.outputs.month }}
      - run: .github/apt-cache.sh
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx --workspace apps/web playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx --workspace apps/web playwright install-deps chromium
      - run: .github/apt-cache.sh done
      - if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: apt-e2e-ubuntu-24.04-${{ steps.keys.outputs.playwright }}-${{ steps.keys.outputs.month }}
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
