categories:
  - id: annual_accounts
    icon: tax
    labels: {en: Annual accounts, fr: Documents annuels, ro: Documente anuale}
    model_definition: 'The annual accounting and tax package of a company: balance sheet (bilan), income statement (compte de résultat), soldes intermédiaires de gestion, liasse fiscale, corporate tax returns and their preparatory checklists, and the accountant''s approval-of-accounts letters. Not payment demands.'
    sort_order: 10
    subcategories:
      - {key: bilan, labels: {en: Balance sheet, fr: Bilan, ro: Bilanț}, sort_order: 10}
      - {key: soldes_intermediaires, labels: {en: Intermediate management balances, fr: Soldes intermédiaires de gestion, ro: Solduri intermediare de gestiune}, sort_order: 20}
      - {key: liasse_fiscale, labels: {en: Tax return package, fr: Liasse fiscale, ro: Liasă fiscală}, sort_order: 30}
      - {key: etats_financiers, labels: {en: Financial statements, fr: États financiers, ro: Situații financiare}, sort_order: 40}
      - {key: approbation, labels: {en: Approval of accounts, fr: Approbation des comptes, ro: Aprobarea conturilor}, sort_order: 50}
  - id: payment_calls
    icon: invoice
    labels: {en: Payment calls, fr: Appels de paiement, ro: Cereri de plată}
    model_definition: 'Payment calls and payment demands from social bodies and the tax office: URSSAF, CARCDSF, OPCO, appel de cotisation, SIE avis de mise en recouvrement, lettre de majoration, saisie administrative à tiers détenteur.'
    sort_order: 20
    subcategories:
      - {key: appel_cotisations, labels: {en: Contribution call, fr: Appel de cotisations, ro: Cerere de contribuții}, sort_order: 10}
      - {key: contribution_opco, labels: {en: OPCO contribution, fr: Contribution OPCO, ro: Contribuție OPCO}, sort_order: 20}
      - {key: avis_mise_recouvrement, labels: {en: Recovery notice, fr: Avis de mise en recouvrement, ro: Aviz de recuperare}, sort_order: 30}
      - {key: relance, labels: {en: Reminder, fr: Relance, ro: Somație de plată}, sort_order: 40}
      - {key: saisie, labels: {en: Administrative seizure, fr: Saisie administrative, ro: Poprire administrativă}, sort_order: 50}
  - id: supplier_invoices
    icon: invoice
    labels: {en: Supplier invoices, fr: Factures fournisseurs, ro: Facturi furnizori}
    model_definition: 'Recurring supplier invoices and letters: dental and medical suppliers and their delivery notes, water, electricity and telecom bills and meter letters.'
    sort_order: 30
    subcategories:
      - {key: facture, labels: {en: Invoice, fr: Facture, ro: Factură}, sort_order: 10}
      - {key: avoir, labels: {en: Credit note, fr: Avoir, ro: Notă de credit}, sort_order: 20}
      - {key: bon_livraison, labels: {en: Delivery note, fr: Bon de livraison, ro: Aviz de livrare}, sort_order: 30}
      - {key: devis, labels: {en: Quote, fr: Devis, ro: Ofertă}, sort_order: 40}
  - id: misc_expenses
    icon: invoice
    labels: {en: Miscellaneous expenses, fr: Dépenses diverses, ro: Cheltuieli diverse}
    model_definition: 'One-off local purchases not from a recurring supplier: shop and DIY receipts, local fuel and parking, post office, contractor quotes and payment reminders, shipping labels.'
    sort_order: 40
    subcategories:
      - {key: ticket, labels: {en: Receipt, fr: Ticket de caisse, ro: Bon fiscal}, sort_order: 10}
      - {key: facture, labels: {en: Invoice, fr: Facture, ro: Factură}, sort_order: 20}
      - {key: colis, labels: {en: Parcel, fr: Colis, ro: Colet}, sort_order: 30}
  - id: sales_invoices
    icon: invoice
    labels: {en: Sales invoices, fr: Factures émises, ro: Facturi emise}
    model_definition: Invoices issued by the practice or one of its companies to its clients (the entity is the seller).
    sort_order: 50
    subcategories:
      - {key: facture, labels: {en: Invoice, fr: Facture, ro: Factură}, sort_order: 10}
      - {key: avoir, labels: {en: Credit note, fr: Avoir, ro: Notă de credit}, sort_order: 20}
  - id: bank
    icon: bank
    labels: {en: Bank, fr: Banque, ro: Bancă}
    model_definition: 'Bank statements and bank letters: relevé de compte, relevé de frais, bank notices.'
    sort_order: 60
    subcategories:
      - {key: releve, labels: {en: Account statement, fr: Relevé de compte, ro: Extras de cont}, sort_order: 10}
      - {key: frais, labels: {en: Fee statement, fr: Relevé de frais, ro: Extras de comisioane}, sort_order: 20}
      - {key: avis, labels: {en: Bank notice, fr: Avis, ro: Aviz bancar}, sort_order: 30}
  - id: payroll
    icon: payroll
    labels: {en: Payroll, fr: Paie et social, ro: Salarizare}
    model_definition: 'Payroll documents: déclaration sociale nominative (DSN), bulletins de salaire or de paie.'
    sort_order: 70
    subcategories:
      - {key: dsn, labels: {en: Nominative social declaration, fr: Déclaration sociale nominative, ro: Declarație socială nominativă}, sort_order: 10}
      - {key: bulletin, labels: {en: Payslip, fr: Bulletin de salaire, ro: Fluturaș de salariu}, sort_order: 20}
  - id: insurance
    icon: insurance
    labels: {en: Insurance, fr: Assurances, ro: Asigurări}
    model_definition: 'Insurance and pension contracts and notices: AGIPI, Abeille, MAE, La Médicale, UNIM, mutuelle, prévoyance, PER, assurance vie.'
    sort_order: 80
    subcategories:
      - {key: per, labels: {en: PER, fr: PER, ro: PER}, sort_order: 10}
      - {key: assurance_vie, labels: {en: Life insurance, fr: Assurance vie, ro: Asigurare de viață}, sort_order: 20}
      - {key: sante, labels: {en: Health insurance, fr: Santé, ro: Asigurare de sănătate}, sort_order: 30}
      - {key: prevoyance, labels: {en: Provident cover, fr: Prévoyance, ro: Prevoyance}, sort_order: 40}
      - {key: multirisque, labels: {en: Multi-risk, fr: Multirisque, ro: Multirisc}, sort_order: 50}
      - {key: responsabilite_civile, labels: {en: Liability, fr: Responsabilité civile, ro: Răspundere civilă}, sort_order: 60}
  - id: training
    icon: training
    labels: {en: Training, fr: Formations, ro: Formări}
    model_definition: Training, courses, certifications and course handouts.
    sort_order: 90
    subcategories:
      - {key: attestation, labels: {en: Certificate, fr: Attestation, ro: Atestat}, sort_order: 10}
      - {key: facture, labels: {en: Invoice, fr: Facture, ro: Factură}, sort_order: 20}
      - {key: support, labels: {en: Course material, fr: Support de cours, ro: Suport de curs}, sort_order: 30}
  - id: travel
    icon: travel
    labels: {en: Travel, fr: Déplacements, ro: Deplasări}
    model_definition: 'Travel expenses: car rental, hotels, transport, and any receipt from a trip away from home (airport shops, duty-free, restaurants, fuel and souvenirs abroad, airport parking, receipts in Spanish or English).'
    sort_order: 100
    subcategories:
      - {key: transport, labels: {en: Transport, fr: Transport, ro: Transport}, sort_order: 10}
      - {key: hotel, labels: {en: Hotel, fr: Hôtel, ro: Hotel}, sort_order: 20}
      - {key: location_voiture, labels: {en: Car rental, fr: Location de voiture, ro: Închiriere de mașină}, sort_order: 30}
      - {key: restaurant, labels: {en: Restaurant, fr: Restaurant, ro: Restaurant}, sort_order: 40}
      - {key: parking, labels: {en: Parking, fr: Parking, ro: Parcare}, sort_order: 50}
  - id: tax
    icon: tax
    labels: {en: Taxes, fr: Impôts et taxes, ro: Impozite și taxe}
    model_definition: 'Tax documents of a person or household that are not payment demands: avis d''imposition, taxe foncière, taxe d''habitation, income-tax preparation documents from a tax adviser. A company''s tax package is annual_accounts; tax payment demands are payment_calls.'
    sort_order: 110
    subcategories:
      - {key: avis_imposition, labels: {en: Tax notice, fr: Avis d'imposition, ro: Aviz de impunere}, sort_order: 10}
      - {key: taxe_fonciere, labels: {en: Property tax, fr: Taxe foncière, ro: Taxă funciară}, sort_order: 20}
      - {key: preparation, labels: {en: Preparatory items, fr: Éléments préparatoires, ro: Elemente pregătitoare}, sort_order: 30}
      - {key: declaration_revenus, labels: {en: Income-tax return, fr: Déclaration de revenus, ro: Declarație de venituri}, sort_order: 40}
      - {key: courrier_fisc, labels: {en: Tax office letter, fr: Courrier du fisc, ro: Corespondență fiscală}, sort_order: 50}
  - id: health
    icon: personal
    labels: {en: Health, fr: Santé, ro: Sănătate}
    model_definition: 'Personal medical and wellness documents: prescriptions, care instructions, health questionnaires, and health-insurance letters (CPAM, Assurance Maladie).'
    sort_order: 120
    subcategories:
      - {key: ordonnance, labels: {en: Prescription, fr: Ordonnance, ro: Rețetă}, sort_order: 10}
      - {key: questionnaire, labels: {en: Health questionnaire, fr: Questionnaire de santé, ro: Chestionar de sănătate}, sort_order: 20}
      - {key: cpam, labels: {en: Health insurance letter, fr: Courrier CPAM, ro: Corespondență CPAM}, sort_order: 30}
  - id: patient_documents
    icon: personal
    labels: {en: Patient documents, fr: Documents patients, ro: Documente pacienți}
    model_definition: 'Documents about the practice''s patients: treatment quotes (devis), prescriptions and post-care instructions the practice gave to a patient.'
    sort_order: 130
    subcategories:
      - {key: devis, labels: {en: Quote, fr: Devis, ro: Ofertă}, sort_order: 10}
      - {key: ordonnance, labels: {en: Prescription, fr: Ordonnance, ro: Rețetă}, sort_order: 20}
      - {key: conseils_post_soins, labels: {en: Post-care advice, fr: Conseils post-soins, ro: Sfaturi post-tratament}, sort_order: 30}
  - id: general
    icon: personal
    labels: {en: General documents, fr: Documents généraux, ro: Documente generale}
    model_definition: 'Other readable documents that fit no category above: contracts, general letters, civil-status certificates, personal letters, real-estate estimates, notes, magazine pages, catalogues. A readable private document belongs here, not in unknown.'
    sort_order: 140
    subcategories:
      - {key: contrat, labels: {en: Contract, fr: Contrat, ro: Contract}, sort_order: 10}
      - {key: courrier, labels: {en: Letter, fr: Courrier, ro: Corespondență}, sort_order: 20}
      - {key: etat_civil, labels: {en: Civil status, fr: État civil, ro: Stare civilă}, sort_order: 30}
      - {key: autre, labels: {en: Other, fr: Autre, ro: Altele}, sort_order: 40}

