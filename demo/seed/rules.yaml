schema: mona.rules/v1
rules:
  - key: opco-selarl
    name: OPCO contribution calls belong to the SELARL
    state: active
    source: seed
    priority: 10
    conditions:
      - {field: counterparty, op: equals, value: opco-ep}
    action: {entity: selarl-simina, category: payment_calls}

  - key: talenz-mdd
    name: TALENZ accounts for Medical Digital Design
    state: active
    source: seed
    priority: 20
    conditions:
      - {field: counterparty, op: equals, value: talenz}
      - {field: text, op: contains, value: medical digital design}
    action: {entity: mdd, category: annual_accounts}

  - key: selarl-annual-accounts
    name: SELARL balance sheets and management summaries
    state: active
    source: seed
    priority: 20
    conditions:
      - {field: text, op: contains, value: selarl docteur christine simina}
      - {field: text, op: contains_any, value: [bilan, soldes intermédiaires de gestion, liasse fiscale]}
    action: {entity: selarl-simina, category: annual_accounts}

  - key: oxyleo-personal-tax
    name: OXYLEO income-tax preparation is personal
    state: active
    source: seed
    priority: 10
    conditions:
      - {field: counterparty, op: equals, value: oxyleo}
    action: {entity: personal, category: tax}

  - key: unim-business
    name: UNIM is a business insurer
    state: active
    source: seed
    priority: 10
    conditions:
      - {field: counterparty, op: equals, value: unim}
    action: {entity: selarl-simina, category: insurance}

  - key: payroll-selarl
    name: Payroll declarations belong to the SELARL
    state: active
    source: seed
    priority: 10
    conditions:
      - {field: text, op: contains_any, value: [déclaration sociale nominative, bulletin de salaire, bulletin de paie]}
    action: {entity: selarl-simina, category: payroll}

  # Disabled copies of rules.learned.yaml: the Apply-failure fallback (Rules › enable → preview).
  - key: agipi-per-by-person-fallback
    name: AGIPI PER, filed under the insured person
    state: disabled
    source: seed
    priority: 20
    conditions:
      - {field: counterparty, op: equals, value: agipi}
      - {field: text, op: contains_any, value: [plan d'épargne retraite, adhésion FAR PER]}
    action: {entity: personal, unit: {from: person}, category: insurance, subcategory: per}

  - key: agipi-assurance-vie-by-person-fallback
    name: AGIPI life insurance, filed under the insured person
    state: disabled
    source: seed
    priority: 20
    conditions:
      - {field: counterparty, op: equals, value: agipi}
      - {field: text, op: contains_any, value: [assurance vie, assurance-vie, situation annuelle]}
    action: {entity: personal, unit: {from: person}, category: insurance, subcategory: assurance_vie}

  - key: hello-bank-lmnp-fallback
    name: Hello bank statements of the LMNP accounts
    state: disabled
    source: seed
    priority: 20
    conditions:
      - {field: counterparty, op: equals, value: hello-bank}
      - {field: iban, op: entity, value: lmnp}
    action: {entity: lmnp, unit: angers-strasbourg, category: bank}
